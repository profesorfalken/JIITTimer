name: Android CI

on:
  push:
    branches:
      - master
      - modernize/kotlin-compose
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build, unit tests and lint
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Locate Android SDK
        run: |
          set -euo pipefail
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK" ]; then
            echo "No Android SDK found at $SDK" >&2
            exit 1
          fi
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "$SDK/platform-tools" >> "$GITHUB_PATH"
          echo "$SDK/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --version || true

      - name: Install SDK packages
        run: |
          set -euo pipefail
          if command -v android >/dev/null 2>&1 && android sdk list >/dev/null 2>&1; then
            android sdk install platforms/android-36 build-tools/36.0.0
          else
            yes | sdkmanager --licenses >/dev/null 2>&1 || true
            sdkmanager "platforms;android-36" "build-tools;36.0.0"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build, test and lint
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jiit-timer-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
